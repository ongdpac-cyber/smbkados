<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEKAI MAHIKARI BUNMEI KYODAN</title>	
  <title>Dojo du Congo Kinshasa</title>
  <title>Groupe de Jeunes Adolescents/ Renseikai Août 2025</title>
  <style>
    :root { --bg:#0b1320; --text:#f5f7fb; --accent:#4f8cff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    .header { padding: 24px 16px; text-align: center; }
    .header h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); }
    .header p { margin: 8px 0 0; opacity: .8; }
    .frame-wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 16px 24px; }
    .ratio { position: relative; width: 100%; min-height: 70vh; }
    .ratio iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.35); background: #111;
    }
    .footer { padding: 12px; text-align: center; font-size: .9rem; opacity: .75; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">
  <img src="https://drive.google.com/uc?export=view&id=12EuG3HOSayDoaOEW6UbAfOmaBdCpG42b"
         alt="Logo" />
    <h1>Groupe de Jeunes Adolescents</h1>
	
    <p>Merci à tous les parents pour le soutien.</p>
  </div>

  <div class="frame-wrap">
    <div class="ratio">
      <!-- #grid = vue en grille, #list = vue en liste -->
      <iframe src="https://drive.google.com/embeddedfolderview?id=1egQyPekdx4IXhnSRuIFN-pSVWZhrlmEz#grid" allow="fullscreen"></iframe>
    </div>
  </div>

  <div class="footer">Astuce : dans l’iframe, cliquez sur une image pour l’ouvrir en grand.</div>
</body>
</html>
